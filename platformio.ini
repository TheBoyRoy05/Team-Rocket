; Feather 32u4: env:main = BNO055 + BMP390 + SD + compact CSV (no LoRa).
; env:main-lora = BNO055 + SD + LoRa (BMP omitted — RadioHead + BMP + full stack will not fit).
[env:main]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test-sd.cpp>
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax
    -D RPL_ENABLE_LORA=0
    -D RPL_COMPACT_CSV=1
lib_deps =
    arduino-libraries/SD@^1.2.4
    adafruit/Adafruit BNO055@^1.6.4
    adafruit/Adafruit BMP3XX Library@^2.1.6

; main-lora: RadioHead is large — BMP is omitted so BNO+SD+LoRa can fit on 32u4.
; Use env:main for BNO+BMP+SD (no LoRa). On one 32u4 you pick: baro+log or radio+log.
[env:main-lora]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test-sd.cpp>
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax
    -D RPL_ENABLE_LORA=1
    -D RPL_COMPACT_CSV=1
    -D RPL_NO_BMP=1
    -D RADIO_LOG_BUF_CAP=128
    -D RADIO_LOG_MAX_PACKET=80
    -D RH_RF95_MAX_MESSAGE_LEN=80
    -D RPL_SD_FLIGHT_BUF_CAP=304
lib_deps =
    arduino-libraries/SD@^1.2.4
    adafruit/Adafruit BNO055@^1.6.4
    mikem/RadioHead@^1.120

[env:test-sd]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
lib_deps =
    arduino-libraries/SD@^1.2.4
