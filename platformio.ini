; Feather 32u4: flash is tight — BNO+BMP+SD does not link. `main` = BNO+SD only
; (no LoRa); `main-lora` = BNO+SD+LoRa. For baro, use a larger MCU or a BMP-only sketch.
[env:main]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test-sd.cpp>
; Add to build_flags for smaller SD writes (USB/LoRa still print CSV lines):
;    -D RPL_SD_BINARY=1
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax
    -D RPL_ENABLE_LORA=0
    -D RPL_NO_BMP=1
lib_deps =
    arduino-libraries/SD@^1.2.4
    adafruit/Adafruit BNO055@^1.6.4

; main-lora: BNO055 + SD + LoRa — BMP omitted (RadioHead fills most of flash).
[env:main-lora]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test-sd.cpp>
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax
    -D RPL_ENABLE_LORA=1
    -D RPL_NO_BMP=1
    -D RADIO_LOG_BUF_CAP=128
    -D RADIO_LOG_MAX_PACKET=80
    -D RH_RF95_MAX_MESSAGE_LEN=80
    -D RPL_SD_FLIGHT_BUF_CAP=304
lib_deps =
    arduino-libraries/SD@^1.2.4
    adafruit/Adafruit BNO055@^1.6.4
    mikem/RadioHead@^1.120

[env:test-sd]
 platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
lib_deps =
    arduino-libraries/SD@^1.2.4
