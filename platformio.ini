; Regenerate IDE flags: pio run -t compiledb  -> compile_commands.json (gitignored)
[env:adafruit_feather_32u4]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<lora_tx_main.cpp>
lib_deps = 
    arduino-libraries/SD@^1.2.4
    adafruit/Adafruit BNO055@^1.6.4
    adafruit/Adafruit BMP3XX Library@^2.1.6

; LoRa bench test: Feather 32u4 + RFM95W → RadioHead TX (M0 RX in lora-m0-receiver/)
; Pin defaults in lora_tx_main.cpp match Adafruit Feather9x_TX (32u4): CS=8 RST=4 INT=7.
; Feather 32u4 + Radio Wing: CS=10 RST=11 INT=2:
;   build_flags = -D LORA_CS=10 -D LORA_RST=11 -D LORA_IRQ=2
; Bench power without USB serial (skip waiting for Serial in setup):
;   build_flags = -D LORA_TX_HEADLESS
; If the monitor stays blank for minutes, USB Serial may never open: increase wait or reopen COM:
;   build_flags = -D LORA_SERIAL_WAIT_MS=45000   (0 = wait forever)
[env:feather32u4_lora_tx]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
; Do not set board_upload.wait_for_upload_port = no on Windows: after the 1200 baud reset the COM
; port drops for a moment; avrdude then fails with "can't open \\.\COM9". Keep default yes (board JSON).
; Close anything using the serial port before upload. Still failing? Double-tap RESET, run upload within ~8s.
; Leave DTR/RTS at defaults so Windows can bring up CDC and show Serial output. If upload is flaky,
; run upload and monitor as separate steps, or use: pio run -t upload && pio device monitor -b 115200 -p COMxx
build_src_filter = +<lora_tx_main.cpp> -<main.cpp>
lib_deps = mikem/RadioHead@^1.120
