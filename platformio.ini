; env:main — BNO055 + BMP390 + SD, compact CSV (no LoRa). BMP: RPL_BMP_MIN.
; env:main-lora — default fit; lora_tx_done in SD, lora_ack_ok=0 unless using main-lora-ack + M0 ACK RX.
; env:main-lora-ack — RX window + ground ACK (flash ~99.5%); flash updated M0 receiver.
[env:main]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test-sd.cpp>
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax
    -D RPL_ENABLE_LORA=0
    ; 10 columns (euler, vertical accel, yaw rate, BMP). Full 25-col CSV does not fit 32u4 flash.
    -D RPL_COMPACT_CSV=1
    -D RPL_BMP_MIN=1
lib_deps =
    arduino-libraries/SD@^1.2.4
    adafruit/Adafruit BNO055@^1.6.4

[env:main-lora]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test-sd.cpp>
build_flags =
    -Os
    -flto
    -fuse-linker-plugin
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax
    -D RPL_ENABLE_LORA=1
    -D RPL_SD_BINARY=1
    -D RPL_BMP_MIN=1
    -D RPL_RF95_MINIMAL=1
    ; LoRa pins: defaults in src/main.cpp (CS5/RST6/IRQ0). Adafruit LoRa wing: add
    ;   -D LORA_CS=8 -D LORA_RST=4 -D LORA_IRQ=7
    -D RPL_SD_FLIGHT_BUF_CAP=192
    -D RPL_MINIMAL_SD=1
lib_deps =
    arduino-libraries/SD@^1.2.4
    adafruit/Adafruit BNO055@^1.6.4

[env:main-lora-ack]
extends = env:main-lora
build_flags =
    ${env:main-lora.build_flags}
    -D RPL_LORA_ACK=1
    ; USB: env:main-lora prints BNO cal changes (c3333) and ack if using main-lora-ack+RX.
    ; env:main-lora-ack: cal logging off (flash); add -D RPL_LOG_ACK_USB=0 to silence "ack" lines.
    -D RPL_LOG_EVENTS=0
    -D RPL_LOG_ACK_USB=1

; Optional USB debug lines: add -D RPL_DEBUG_SERIAL=1 to env:main or env:main-lora.

[env:test-sd]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
lib_deps =
    arduino-libraries/SD@^1.2.4
