; Serial: full TR v1 row + rssi column (printed once at boot + per packet).
; SD log: use env adafruit_feather_m0_sd (Feather M0 + Adalogger / SD wing, CS 10 typical).
[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino

monitor_speed = 115200
build_flags = -I../src
lib_deps = mikem/RadioHead@^1.120

[env:adafruit_feather_m0_sd]
extends = env:adafruit_feather_m0
build_flags =
    ${env:adafruit_feather_m0.build_flags}
    -D RPL_RX_SD_CS=10
lib_deps =
    mikem/RadioHead@^1.120
    arduino-libraries/SD@^1.2.4